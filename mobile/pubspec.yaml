publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: 3.35.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
